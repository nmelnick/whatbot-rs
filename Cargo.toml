[workspace]
resolver = "2"
members = [
    "crates/whatbot-core",
    "crates/whatbot-storage",
    "crates/whatbot-io-console",
    "crates/whatbot-io-discord",
    "crates/whatbot-commands",
    "crates/whatbot-test-support",
    "crates/whatbot",
]
default-run = "whatbot"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["whatbot contributors"]

[workspace.dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
dashmap = "6"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.3"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
url = { version = "2", features = ["serde"] }
regex = "1"
once_cell = "1"
rand = { version = "0.8", features = ["small_rng"] }
clap = { version = "4", features = ["derive"] }

sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "macros", "migrate"] }
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "rustls_backend", "model", "cache"] }

whatbot-core     = { path = "crates/whatbot-core" }
whatbot-storage  = { path = "crates/whatbot-storage" }
whatbot-commands = { path = "crates/whatbot-commands" }
whatbot-io-console = { path = "crates/whatbot-io-console" }
whatbot-io-discord = { path = "crates/whatbot-io-discord" }
whatbot-test-support = { path = "crates/whatbot-test-support" }
